experiences:
  - company: Booking.com — London, UK
    role: Software Engineer
    period: 2026 — Present
    achievements:
      - >-
        Architected and built a PSP reconciliation platform with Java Spring
        Boot and React to ingest, match, and reconcile daily PSP settlement
        files across 6 payment service providers.
      - >-
        Designed AWS infrastructure with Terraform and implemented CI/CD
        through GitLab and Harness to deploy Kubernetes workloads and AWS
        Lambda functions for automated settlement processing and daily
        reporting.
      - >-
        Designed and developed a Data Quality Framework for Apache Airflow and
        Astronomer reporting tools, supporting 200+ finance workflows to
        ensure the accuracy and reliability of financial data.
  - company: THG — Manchester, UK
    role: Software Engineer
    period: 2023 — 2025
    achievements:
      - >-
        Architected scalable microservices including Stockmanager,
        Dropshipmanager, Allocation service and Stock UI with Spring and
        Angular, delivering front-end and back-end e-commerce solutions with
        over 90% unit test coverage.
      - >-
        Moved legacy Tomcat-based servers to a Kubernetes-based architecture
        and designed Jenkins pipelines, cutting deployment time from 30 to 10
        minutes with Docker-based containerized deployment.
      - >-
        Engineered a multi-database layer spanning Microsoft SQL Server,
        CockroachDB and CouchDB (SQL & NoSQL), reducing database overhead by
        40% through optimized batched queries.
      - >-
        Led 3+ key client integrations (Warehouse, Fulfillment, Stock, Orders)
        processing 500K+ SKU updates daily, reducing stock discrepancies by
        85%, and owned production support for critical integrations.
  - company: Samsung R&D — Bengaluru, India
    role: Software Engineer
    period: 2021 — 2023
    achievements:
      - >-
        Full-stack developer on the Java Spring-based LSM (LTE System
        Manager) in the Networks and OAM team, part of the Element Management
        System handling telecom network elements.
      - >-
        Built and refined EMS capabilities enabling 5G network administration
        for multiple clients, focusing on the Fault module.
      - >-
        Provided TAC3 support for 4G networks of JIO, SKT, KT, UQ, KDDI, LGT,
        KPS and others.
      - >-
        Wrote Selenium tests with Robot Framework and JUnit for the EMS
        product code.
  - company: The Linux Foundation
    role: Hyperledger Mentee
    period: 2021
    achievements:
      - >-
        Implemented cross-chain contract interoperability between Hyperledger
        Fabric and Hyperledger Besu in the "ServiceMesh" way.
      - >-
        Developed a cross-chain Solidity smart contract with a 2-phase
        locking mechanism.
      - >-
        Engineered a Java Spring sidecar relay listening for Solidity events
        and orchestrating transactions on other relays over REST APIs.
  - company: Zenithec Techware — Raipur, India
    role: iOS Developer
    period: 2019 — 2021
    achievements:
      - Built the PetBro Business iOS application from scratch.
      - >-
        Structured the app on MVVM with RxSwift, using RxMoya as the network
        abstraction layer and RxNuke for image caching.
  - company: allsoft — Raipur, India
    role: Software Developer Intern
    period: '2019'
    achievements:
      - Worked on the GFI Auction project built on the Angular framework.
      - Integrated NgRx Store for reactive state management.

