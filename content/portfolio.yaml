# ============================================================================
# Site content — the single file to edit when updating the portfolio.
#
# Parsed at BUILD time (webpack yaml-loader) and inlined into the bundle, so
# the site never fetches content at runtime. After editing: rebuild/deploy.
#
# Shape notes:
# - skills: category must be one of frontend | backend | devops | cloud |
#   blockchain. The FIRST 10 per category ride the 3D sphere (order matters);
#   a skill only shows an icon/colour if it's mapped in
#   components/pages/Skills.tsx (SKILL_ICONS / SKILL_COLORS).
# - communityEvents: type must be conference | hackathon | meetup | talk.
# - contact.links: icon must be one of github | linkedin | twitter | x |
#   instagram | telegram | mail (components/pages/Contact.tsx LINK_ICONS).
# - contact.handle is DISPLAY-ONLY here: the handwritten "@rxShri99" strokes
#   are generated into data/handwriting.ts by scripts/build-handwriting.mjs —
#   regenerate them if the handle changes.
# ============================================================================

# SEO + link previews (Open Graph / Twitter cards). `url` must be the
# canonical deployed origin — change it if you move to a custom domain.
# The preview image lives at public/preview.png.
